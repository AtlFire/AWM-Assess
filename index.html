<style id="appcss">
:root{
  --bg:#edf1ee; --surface:#ffffff; --ink:#22302b; --muted:#54635c; --line:#cbd6d0;
  --brand:#1f4a3d; --brand-ink:#ffffff; --tide:#2e6f8e; --tint:#e3ece7;
  --good:#2b7a4b; --good-bg:#e3f2e8; --fair:#9a5b00; --fair-bg:#fff2d9; --poor:#ae2a22; --poor-bg:#fbe6e3; --shadow:rgba(20,32,27,.12);
  --logo-r1:#2e6f8e; --logo-r2:#9cc5b5; --logo-disc:#1f4a3d; --logo-inner:#ffffff;
  --head:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111a16; --surface:#1a2621; --ink:#e8efeb; --muted:#9db0a7; --line:#33443d; --tint:#1c2b25;
    --brand:#9cc5b5; --brand-ink:#0b1712; --tide:#7fb6d1;
    --good:#6fcf95; --good-bg:#183524; --fair:#f0b45a; --fair-bg:#3a2b10; --poor:#ff8a80; --poor-bg:#411b18; --shadow:rgba(0,0,0,.4);
    --logo-r1:#7fb6d1; --logo-r2:#d8c7a6; --logo-disc:#9cc5b5; --logo-inner:#16352c;
  }
}
:root[data-theme="dark"]{
  --bg:#111a16; --surface:#1a2621; --ink:#e8efeb; --muted:#9db0a7; --line:#33443d; --tint:#1c2b25;
  --brand:#9cc5b5; --brand-ink:#0b1712; --tide:#7fb6d1;
  --good:#6fcf95; --good-bg:#183524; --fair:#f0b45a; --fair-bg:#3a2b10; --poor:#ff8a80; --poor-bg:#411b18; --shadow:rgba(0,0,0,.4);
  --logo-r1:#7fb6d1; --logo-r2:#d8c7a6; --logo-disc:#9cc5b5; --logo-inner:#16352c;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h2{font-family:var(--head);font-size:24px;margin:18px 0 2px;line-height:1.1;letter-spacing:-.01em}
h3{font-family:var(--head);margin:0 0 6px}
.wrap{max-width:900px;margin:0 auto;padding:0 14px 120px}
.chrome{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:max(8px,env(safe-area-inset-top));border-bottom:1px solid var(--line)}
.chrome .wrap{padding-bottom:0}
.bar{display:flex;align-items:center;gap:10px;padding:4px 0 8px}
.brandbox{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brandbox svg,.brandbox img{width:38px;height:38px;flex:0 0 auto;object-fit:contain}
.brandbox .t{min-width:0}
.brandbox b{display:block;font-family:var(--head);font-size:16px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brandbox span{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1.5px solid var(--brand);background:transparent;color:var(--brand);font-weight:700}
.btn.solid{background:var(--brand);color:var(--brand-ink)}
.btn.tide{background:var(--tide);border-color:var(--tide);color:#fff}
.btn.warn{border-color:var(--poor);color:var(--poor)}
.btn.small{min-height:38px;padding:0 12px;font-size:16px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.modes{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:0 0 8px}
.modes button{min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;padding:0 2px}
.modes button.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.prog{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:0 0 8px}
.prog i{display:block;height:100%;background:var(--brand)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-height:44px;padding:4px 14px;border-radius:22px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;text-align:center}
.tab small{display:block;font-weight:500;color:var(--muted);font-size:12px;line-height:1.1}
.tab.on{background:var(--tide);border-color:var(--tide);color:#fff}
.tab.on small{color:#fff;opacity:.9}
.tab.alert{border-color:var(--poor)}
.sub{color:var(--muted);margin:0 0 12px;font-size:16px}
.card,.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px;box-shadow:0 1px 2px var(--shadow)}
.item.flagged{border-color:var(--poor);border-width:2px}
.item.crit .ttl::after{content:" • priority item";font-weight:500;font-size:13px;color:var(--muted)}
.ttl{font-weight:700;font-size:18px}
.hint{color:var(--muted);font-size:15px;margin:2px 0 10px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
.seg button.on[data-r="g"]{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.seg button.on[data-r="f"]{background:var(--fair-bg);border-color:var(--fair);color:var(--fair)}
.seg button.on[data-r="p"]{background:var(--poor-bg);border-color:var(--poor);color:var(--poor)}
.seg button.on[data-r="n"]{background:var(--bg);border-color:var(--muted);color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
textarea,input[type=text],input[type=date],input[type=tel],input[type=email],input[type=url],input[type=number],select{width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);min-height:46px}
textarea{min-height:64px;resize:vertical;margin-top:10px}
label.f{display:block;margin:0 0 12px;font-weight:700;font-size:15px}
label.f > *:not(span){margin-top:5px;font-weight:400}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 10px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}.grid3{grid-template-columns:1fr 1fr}}
.flagbtn{min-height:38px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:15px}
.flagbtn.on{background:var(--poor-bg);border-color:var(--poor);color:var(--poor)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.thumb{position:relative;width:92px;height:92px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:2px;right:2px;width:30px;height:30px;border-radius:15px;border:none;background:rgba(0,0,0,.65);color:#fff;font-size:16px;line-height:1}
.esc{display:flex;gap:12px;align-items:flex-start}
.esc .seg{grid-template-columns:repeat(2,64px);flex:0 0 auto}
.esc .g{margin-top:8px;color:var(--poor);font-size:15px;font-weight:700}
.pill{display:inline-block;padding:2px 10px;border-radius:12px;font-size:14px;font-weight:700}
.pill.g{background:var(--good-bg);color:var(--good)}
.pill.f{background:var(--fair-bg);color:var(--fair)}
.pill.p{background:var(--poor-bg);color:var(--poor)}
.pill.n{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.pill.t{background:var(--tint);color:var(--tide)}
.attn{border:2px solid var(--poor);background:var(--poor-bg);border-radius:14px;padding:12px 14px;margin:0 0 12px}
.attn h3{margin:0 0 6px;font-size:18px;color:var(--poor)}
.attn ul{margin:0;padding-left:20px}
.attn li{margin:4px 0}
.warnbox{border:2px solid var(--fair);background:var(--fair-bg);border-radius:14px;padding:12px 14px;margin:0 0 12px}
.okbox{border:2px solid var(--good);background:var(--good-bg);border-radius:14px;padding:12px 14px;margin:0 0 12px}
.score{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.score .big{font-family:var(--head);font-size:38px;font-weight:800;line-height:1}
.act{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.act:first-child{border-top:none;padding-top:0;margin-top:0}
.notice{font-size:14px;color:var(--muted);margin:14px 0}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 12px}
@media (min-width:640px){.stat{grid-template-columns:repeat(4,1fr)}}
.stat div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--head);font-size:22px;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;min-height:38px;padding:0 14px;border-radius:19px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:15px}
.chips button.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.joblist .item{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:900px;border-radius:18px 18px 0 0;padding:16px;max-height:88vh;display:flex;flex-direction:column;gap:10px;overflow:auto}
.sheet textarea{flex:1;min-height:40vh;font-size:14px;font-family:ui-monospace,Menlo,monospace}
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg);border-top:1px solid var(--line);padding:8px 14px max(8px,env(safe-area-inset-bottom))}
.navbar .in{max-width:900px;margin:0 auto;display:grid;grid-template-columns:1fr 2fr;gap:10px}
.dm{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 0}
.dm button{min-height:42px;padding:0 14px;border-radius:21px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:15px}
.dm button.on{background:var(--tide);border-color:var(--tide);color:#fff}
.logoprev{display:flex;align-items:center;gap:14px}
.logoprev svg,.logoprev img{width:72px;height:72px;object-fit:contain}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:78px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;max-width:90vw;font-size:15px;box-shadow:0 4px 14px var(--shadow)}
.est{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.est.open{display:block}
.money{font-family:var(--head);font-weight:800}
.qline{display:grid;grid-template-columns:1fr 110px 40px;gap:8px;align-items:start;margin:0 0 10px}
.qline textarea{margin:0;min-height:52px}
.totals{margin-top:8px;border-top:2px solid var(--line);padding-top:8px}
.totals div{display:flex;justify-content:space-between;padding:3px 0}
.totals .big{font-family:var(--head);font-size:22px;font-weight:800}
.sigwrap{border:1.5px dashed var(--line);border-radius:12px;background:#fff;touch-action:none}
.sigwrap canvas{display:block;width:100%;height:150px;touch-action:none}
.taskrow{display:flex;gap:10px;align-items:flex-start}
.taskrow input[type=checkbox]{width:28px;height:28px;flex:0 0 auto;margin-top:3px;accent-color:var(--brand)}
.timer{font-family:var(--head);font-size:34px;font-weight:800}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:none}
.kv span:first-child{color:var(--muted)}
:focus-visible{outline:3px solid var(--tide);outline-offset:2px}
</style>
<style id="docss">
.report{background:#fff;color:#14201a;border-radius:6px;padding:26px;margin:14px 0;font-family:"Source Sans 3",system-ui,sans-serif;font-size:16px;line-height:1.5}
.report h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:30px;margin:0 0 4px;color:#1f4a3d;line-height:1.1;letter-spacing:-.01em}
.report h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:20px;margin:26px 0 8px;color:#1f4a3d;border-bottom:2px solid #2e6f8e;padding-bottom:4px}
.report h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:16px;margin:16px 0 4px;color:#1f4a3d}
.report p{margin:6px 0}
.report table{width:100%;border-collapse:collapse;margin:8px 0}
.report th,.report td{border:1px solid #c8d3cd;padding:7px 9px;text-align:left;vertical-align:top;font-size:14.5px}
.report th{background:#e8f0ec}
.report td.r,.report th.r{text-align:right}
.report .meta{display:grid;grid-template-columns:1fr 1fr;gap:3px 20px;font-size:14.5px}
.report .attn{background:#fbe6e3;color:#14201a;border-color:#ae2a22}
.report .attn h3{color:#ae2a22;margin-top:0}
.report .pill{display:inline-block;padding:2px 10px;border-radius:12px;font-size:13.5px;font-weight:700}
.report .pill.g{background:#e3f2e8;color:#1e6a3d}.report .pill.f{background:#fff2d9;color:#8a5200}.report .pill.p{background:#fbe6e3;color:#ae2a22}.report .pill.n{background:#eee;color:#555}.report .pill.t{background:#e0eef4;color:#1f5b78}
.report .ph{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.report .ph img{width:170px;height:125px;object-fit:cover;border:1px solid #ccc;border-radius:4px}
.report .small{font-size:12.5px;color:#444}
.report .item-row{break-inside:avoid;margin:0 0 12px;padding:0 0 10px;border-bottom:1px solid #e3e8e5}
.report .why{color:#333}
.report .todo{color:#1f4a3d;font-weight:700}
.report .cover{display:flex;align-items:center;gap:16px;border-bottom:4px solid #1f4a3d;padding-bottom:14px;margin-bottom:14px}
.report .cover svg,.report .cover img{width:82px;height:82px;object-fit:contain;flex:0 0 auto}
.report .cover .co{font-size:15px;color:#333}
.report .glance{display:grid;grid-template-columns:1fr;gap:10px}
.report .box{border:1.5px solid #1f4a3d;border-radius:8px;padding:10px 14px;background:#eef4f1}
.report .box h3{margin-top:0}
.report ol,.report ul{margin:6px 0;padding-left:22px}
.report li{margin:3px 0}
.report .chk{list-style:none;padding-left:0}
.report .chk li::before{content:"\2610  ";}
.report .cal{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.report .cal,.report .meta{grid-template-columns:1fr}}
.report .pb{break-before:page}
.report .foot{margin-top:24px;border-top:1px solid #c8d3cd;padding-top:8px}
.report .tot{margin-left:auto;width:min(340px,100%)}
.report .tot div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #e3e8e5}
.report .tot .big{font-weight:800;font-size:18px;border-bottom:2px solid #1f4a3d}
.report .sig{border:1px solid #c8d3cd;border-radius:6px;min-height:80px;padding:6px;margin:6px 0}
.report .sig img{max-height:90px}
.report .line{border-bottom:1px solid #999;height:26px;margin:6px 0}
.report .stamp{display:inline-block;border:2px solid #1f4a3d;color:#1f4a3d;border-radius:6px;padding:2px 10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:13px}
@media print{
  body{background:#fff}
  .chrome,.noprint,.navbar{display:none!important}
  .wrap{max-width:none;padding:0}
  .report{margin:0;padding:0;border-radius:0}
}
</style>
</head>

<div class="wrap" id="main"></div>
<div class="navbar noprint" id="nav" style="display:none"></div>
<script>
"use strict";
/* ================= DATA ================= */
const OPTS = {
  propType:["Year-round home","Seasonal cottage","Multi-unit / condo","Commercial","Campground / other"],
  roof:["Metal","Asphalt shingle","Clay / composite tile","Wood shake","Other / unsure"],
  siding:["Vinyl","Fibre cement / stucco / brick","Wood / cedar","Other / unsure"],
  deck:["No deck","Non-combustible / composite","Wood deck","Wood deck with open underside"],
  slope:["Flat / gentle","Moderate","Steep (fire may run uphill toward the home)"],
  woods:["Over 100 m","30 to 100 m","10 to 30 m","Under 10 m"],
  ownerAuth:["Owner present / authorized","Tenant with owner's permission","Tenant, no owner permission","Unsure"],
  burn:["Checked: no restriction","Checked: restrictions in effect","Checked: ban / woods closure","Not checked"]
};
const SECTIONS = [
 {id:"z1",tab:"0–1.5 m",name:"Zone 1: 0 to 1.5 m",sub:"The non-combustible zone around the house and deck.",client:"Right against your house and deck. Keeping this strip free of anything that can burn is one of the most effective steps.",
  meas:[{k:"comb",l:"Nearest combustible material to the house or deck",u:"m",t:"comb"}],
  items:[
  {id:"z1a",w:3,t:"Ground next to the foundation",h:"Gravel, pavers or bare soil is good. Mulch, wood chips, dry plants or lawn clippings against the wall is poor.",fix:"Remove combustible mulch and plants within 1.5 m of the walls; replace with gravel, pavers or bare soil.",why:"Embers can land in mulch and dry plants and smoulder right against the wall."},
  {id:"z1b",w:1,t:"Combustibles against walls",h:"Firewood, planters, furniture, propane grills, trash bins, stacked lumber.",fix:"Move combustible items at least 1.5 m from the house walls.",why:"Items stacked against walls give embers something to ignite next to the house."},
  {id:"z1c",w:3,t:"Under deck, porch and stairs",h:"Storage, dry leaves, open gaps where embers can collect.",fix:"Clear stored items and debris under the deck; enclose or screen the open underside with non-combustible material.",why:"Embers collect under decks and are hard to see; stored items and debris there can ignite the house from below."},
  {id:"z1d",w:1,t:"Deck surface and debris",h:"Needles and leaves in the gaps, wood condition, items left on the deck.",fix:"Clean debris from the deck surface and gaps; keep the deck clear of combustible clutter.",why:"Leaves and needles in deck gaps can ignite from embers."},
  {id:"z1e",w:3,t:"Roof covering and condition",h:"Metal, asphalt, clay or composite is better than wood shakes. Note curled, missing or damaged pieces.",fix:"Repair or replace damaged roofing; ask about a Class A rated covering if the roof is wood shake.",why:"The roof is one of the first places embers land, so the covering and its condition matter."},
  {id:"z1f",w:1,t:"Gutters, valleys and roof debris",h:"Needles and leaves in gutters, valleys and around chimneys.",fix:"Clean gutters and roof valleys; consider non-combustible gutter guards.",why:"Dry leaves and needles in gutters and valleys can catch embers."},
  {id:"z1g",w:3,t:"Vents and openings",h:"Attic, soffit, foundation and crawlspace vents. Look for missing or damaged screens where embers can enter. Confirm the current mesh specification before recommending a product.",fix:"Screen or cover vents and openings with fine non-combustible mesh.",why:"Vents can let embers into attics and crawlspaces where they are hard to spot."},
  {id:"z1h",w:1,t:"Siding, eaves and soffits",h:"Gaps, rot, wood siding close to the ground, open eaves.",fix:"Repair gaps and damage; keep siding clear of the ground and add non-combustible protection near grade.",why:"Gaps and untreated wood let embers and heat reach the structure."},
  {id:"z1i",w:1,t:"Windows and doors",h:"Cracked glass, gaps, weatherstripping, wood trim condition.",fix:"Repair gaps and damaged seals; consider upgraded glazing when windows are replaced.",why:"Heat can crack glass, and gaps let embers in."},
  {id:"z1j",w:1,t:"Fences and attachments touching the house",h:"A wood fence, trellis or lattice connected to the house acts like a fuse.",fix:"Replace the last 1.5 m of any fence connected to the house with non-combustible material, or leave a gap.",why:"A fence attached to the house can carry fire directly to the wall."}
 ]},
 {id:"z2",tab:"1.5–10 m",name:"Zone 1.5 to 10 m",sub:"Intermediate area around the structure.",client:"From the edge of the first strip out to about 10 m. The goal is to keep fuel low, spaced apart, and away from the house.",
  meas:[{k:"conif",l:"Distance to nearest conifer (spruce, fir, pine, cedar)",u:"m",t:"conif"},{k:"space",l:"Spacing between nearest tree crowns",u:"m",t:"space"},{k:"shed",l:"Distance to nearest outbuilding",u:"m"},{k:"wood",l:"Distance from house to woodpile",u:"m"},{k:"prop",l:"Cleared distance around propane or fuel tank",u:"m"}],

function computeResult(j){
  let got=0,tot=0,rated=0,required=0,unanswered=0;const flags=[];
  allItems().forEach(({it,s})=>{
    const a=j.answers[it.id]||{};required++;
    if(!a.r)unanswered++;
    if(a.r==="g"||a.r==="f"||a.r==="p"){rated++;const pts=a.r==="g"?100:a.r==="f"?50:0;got+=pts*it.w;tot+=100*it.w;}
    if(a.r==="p"&&it.w===3)flags.push({kind:"Priority item rated Poor",text:it.t,sec:s.name,note:a.note});
    if(a.flag)flags.push({kind:"Flagged for human review",text:it.t,sec:s.name,note:a.note});
  });
  SECTIONS.forEach(s=>(s.meas||[]).forEach(m=>{const st=measStatus(m,(j.meas||{})[m.k]);if(st.s==="below")flags.push({kind:"Measurement below target",text:m.l+": "+j.meas[m.k]+" "+m.u+" (target at least "+st.t+" "+m.u+")"});}));
  ESC.forEach(e=>{if(j.esc[e.id])flags.push({kind:"Escalation",text:e.t,extra:e.g,note:j.escNotes[e.id]||""});});
  if(j.info.ownerAuth!==OPTS.ownerAuth[0])flags.push({kind:"Authorization",text:"Owner authorization: "+j.info.ownerAuth,extra:"Confirm owner permission before quoting or working."});
  if(j.info.burn===OPTS.burn[2]||j.info.burn===OPTS.burn[3])flags.push({kind:"Burn status",text:"Burn map status: "+j.info.burn,extra:"Check the provincial burn map and any woods-access restriction."});
  const pct=tot?Math.round(got/tot*100):null;
  let level=pct===null?"Not enough data":pct>=80?"Low":pct>=60?"Moderate":pct>=40?"High":"Extreme";
  const critPoor=flags.some(f=>f.kind==="Priority item rated Poor");
  const order=["Low","Moderate","High","Extreme"];
  if(critPoor&&level!=="Not enough data"&&order.indexOf(level)<2)level="High";

}

function makeInvoice(j,type){

  let amount=type==="deposit"?t.dep:cents(t.total-dueDep);
  if(amount<=0)return null;
  const rate=settings.hstOn?settings.hstRate:0;
  const sub=cents(amount/(1+rate/100));const hst=cents(amount-sub);
  const issued=today();
  const due=type==="deposit"?addDays(issued,7):addDays(j.work.finished||issued,settings.balanceDays);
  const inv={id:uid(),number:nextInvoiceNo(),type,issued,due,amount,sub,hst,payments:[],

function stageOf(j){

    const t=q?quoteTotals(q):null;
    const billed=cents(j.invoices.reduce((s,i)=>s+i.amount,0));
    if(allPaid&&t&&billed>=t.total-0.005)return "paid";
    return "invoiced";
  }
  if(j.work.finished)return "complete";
  if(j.work.started||j.work.hours.length||(j.work.timerStart))return "inprogress";
  if(q&&q.status==="accepted")return "accepted";

function planText(j){
  const res=computeResult(j),inf=j.info,L=[];
  L.push("WILDFIRE READINESS PLAN",settings.company,"","Client: "+inf.client,"Address: "+inf.address,"Date: "+inf.date,"Assessor: "+inf.assessor);
  L.push("","Attention level: "+res.level+(res.pct!==null?" (score "+res.pct+"%)":""));if(j.summary)L.push(j.summary);
  const mr=measRows(j);if(mr.length){L.push("","MEASUREMENTS");mr.forEach(r=>L.push("- "+r.l+": "+r.v+(r.t?" ("+r.t+")":"")+" "+r.s));}
  L.push("","ACTION PLAN");sortedActions(j).forEach(a=>L.push("- ["+a.prio+"] "+a.text+" ("+costBand(a)+")"));
  L.push("","FINDINGS");SECTIONS.forEach(s=>{L.push("",s.name);s.items.forEach(it=>{const a=j.answers[it.id]||{};L.push("- "+it.t+": "+(a.r?RLABEL[a.r]:"Not rated")+(a.note?" — "+a.note:""));});});
  L.push("","Limitations: observable conditions on the visit date only; no guarantee against wildfire loss or insurance outcome.",INDEP);
  return L.join("\n");
}
function docFor(kind){
  if(kind==="plan")return {html:planHTML(job),name:"wildfire-readiness-plan",title:"Wildfire Readiness Plan"};
  if(kind==="quote")return {html:quoteHTML(job),name:"quote",title:"Quote"};
  if(kind==="invoice"){const inv=job.invoices.find(i=>i.id===docInv)||job.invoices[job.invoices.length-1];return {html:invoiceHTML(job,inv),name:"invoice-"+(inv?inv.number:""),title:"Invoice"};}
  if(kind==="crew")return {html:crewHTML(job),name:"crew-copy",title:"Work Order: Crew Copy"};
  if(kind==="done")return {html:completionHTML(job),name:"work-completed",title:"Work Completed"};
  return {html:internalHTML(job),name:"internal-record",title:"Internal Assessment Record"};
}
function renderDocs(m){
  const kinds=[["plan","Client plan"],["quote","Quote"],["invoice","Invoice"],["crew","Crew copy"],["done","Completion"],["internal","Internal"]];
  const dm=h("div",{class:"dm noprint"});
  kinds.forEach(([k,l])=>dm.append(h("button",{class:docKind===k?"on":"",onclick:()=>{docKind=k;render();}},l)));
  m.append(dm);
  if(docKind==="invoice"&&job.invoices.length>1)m.append(h("label",{class:"f noprint",style:"margin-top:10px"},h("span",{},"Which invoice"),h("select",{onchange:e=>{docInv=e.target.value;render();}},job.invoices.map(i=>h("option",{value:i.id,selected:i.id===docInv},i.number+" · "+i.type)))));
  const res=computeResult(job);
  if(docKind==="plan"){const w=[];if(res.unanswered)w.push(res.unanswered+" items are not rated and will be left out.");if(res.flags.length)w.push(res.flags.length+" flagged items should be reviewed by a person before this goes to the client.");if(w.length)m.append(h("div",{class:"warnbox noprint",style:"margin-top:12px"},h("strong",{},"Before you send this: "),w.join(" ")));}
  if(docKind==="quote"&&!job.quote){m.append(h("div",{class:"card",style:"margin-top:12px"},"No quote yet."),h("button",{class:"btn solid",onclick:()=>go({mode:"quote"})},"Build a quote"));return;}
  if(docKind==="invoice"&&!job.invoices.length){m.append(h("div",{class:"card",style:"margin-top:12px"},"No invoices yet."),h("button",{class:"btn solid",onclick:()=>go({mode:"bill"})},"Go to billing"));return;}
  if(docKind==="done"&&!includedActions(job).length){m.append(h("div",{class:"card",style:"margin-top:12px"},"No work is included yet."));return;}
  const d=docFor(docKind);
  m.append(h("div",{class:"row noprint"},
    h("button",{class:"btn solid",onclick:()=>saveFile(slug(job.info.client)+"-"+d.name+"-"+(job.info.date||today())+".html",exportDoc(d.html,d.title))},"Save file"),
    docKind==="plan"?h("button",{class:"btn",onclick:()=>showText(planText(job))},"Text version"):null,
    h("button",{class:"btn",onclick:()=>{try{window.print();}catch(e){toast("Print isn't available here.");}}},"Print"),
    h("button",{class:"btn",onclick:()=>saveBackup([job])},"Job backup")));
  m.append(h("p",{class:"notice noprint"},"Save file makes a document you can email or share. Open it in a browser and choose Print, then Save as PDF, to make a PDF."));
  const r=h("div",{class:"report"});r.innerHTML=d.html;m.append(r);
}
